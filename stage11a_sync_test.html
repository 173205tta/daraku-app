<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第11段階A 同期テスト</title><style>body{background:#101827;color:#eef;font:16px system-ui;padding:20px;max-width:600px;margin:auto}button,input{font:inherit;padding:12px;margin:8px 0;width:100%;box-sizing:border-box}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202d40;padding:16px}button:disabled{opacity:.4}</style><h2>第11段階A：同期テスト</h2><p>本番データとは別のテスト領域を使用します。</p><pre id="status">認証待機中</pre><input id="value" maxlength="100" placeholder="テスト文字列"><button id="save" disabled>表示中のrevisionを基準に保存</button><pre id="result"></pre><a href="./index.html" style="color:#9cf">アプリへ戻る</a><script type="module">
import {auth,db} from './firebase.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import {doc,onSnapshot,runTransaction} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
const $=id=>document.getElementById(id);let stop,ref,rev=null,busy=false,epoch=0;
function buttons(){ $('save').disabled=busy||rev===null||!ref; }
onAuthStateChanged(auth,u=>{const e=++epoch;stop?.();ref=null;rev=null;buttons();$('status').textContent=u?'サーバー確認中':'本番アプリでログインしてください';if(!u)return;ref=doc(db,'darakuSyncTestV1',u.uid);stop=onSnapshot(ref,{includeMetadataChanges:true},s=>{if(e!==epoch)return;rev=null;if(!s.metadata.fromCache&&!s.metadata.hasPendingWrites){rev=s.exists()?s.data().revision:0;if(!Number.isSafeInteger(rev)||rev<0)rev=null;}$('status').textContent=(rev===null?'未確認（保存不可）':'サーバー確認済み')+'\nrevision: '+(rev??'未確認')+'\nテスト文字列: '+(s.exists()?s.data().value:'未作成');buttons();},err=>{rev=null;buttons();$('status').textContent=err.code+': '+err.message;});});
$('save').onclick=async()=>{if(busy||rev===null||!ref)return;const r=ref,expected=rev,uid=auth.currentUser?.uid,value=$('value').value.trim(),e=epoch;if(!value||!uid)return;busy=true;buttons();try{await runTransaction(db,async tx=>{if(epoch!==e||auth.currentUser?.uid!==uid)throw Error('認証変更');const s=await tx.get(r);if((s.exists()?s.data().revision:0)!==expected)throw Error('競合：最新の表示を確認してください');const data={ownerUid:uid,revision:expected+1,value};if(s.exists())tx.update(r,data);else tx.set(r,data);});$('result').textContent='保存成功：revision '+(expected+1);}catch(err){$('result').textContent='保存中止：'+err.message;}finally{busy=false;buttons();}};
</script></html>
