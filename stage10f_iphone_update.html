<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第10段階F iPhone→Firebase</title><style>body{background:#0e1729;color:#eaf1ff;font:16px system-ui;margin:0;padding:20px;line-height:1.6}main{max-width:680px;margin:auto}section{background:#1c2b43;border-radius:12px;padding:16px;margin:16px 0}button{background:#2d79d4;color:white;border:0;border-radius:9px;padding:13px;margin:6px 0;font-weight:bold;width:100%}button:disabled{opacity:.35}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1423;padding:12px;border-radius:8px}small{color:#b8c6da}.warn{color:#ffcc82}</style></head><body><main><h2>第10段階F：iPhone → Firebase</h2><p class="warn">iPhoneのホーム画面アプリ内から開くこと。PC・通常Safariから実行しない。端末データは変更しません。自動同期は無効のままです。</p><section><strong>① 読み取り・準備</strong><button id="check" disabled>最新の端末とクラウドを確認</button><pre id="status">認証待機中…</pre></section><section><strong>② 手動で1回だけ更新</strong><p>最新JSONを「ファイル」アプリに保存済みであることを確認してから実行してください。クラウドのrevisionが変わった場合は中止します。</p><label><input id="confirm" type="checkbox"> 最新バックアップを保存済み・このiPhoneが正本であることを確認した</label><button id="write" disabled>Firebaseへ1回だけ更新（revision +1）</button><pre id="result">未実行</pre></section><p><small>このページはlocalStorageへの書き込み、データの復元、削除を行いません。ログイン状態が見つからない場合は本番アプリでログインしてください。</small></p></main><script type="module">
import {auth,db} from './firebase.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import {doc,getDocFromServer,runTransaction} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
const KEY='daraku_app_bank_v1',EXPECTED='dcbfe6c7dbad4650204cd380c4c624163ffde395b6bd3fc49caf52dd49fae9e2';
const $=id=>document.getElementById(id);let user=null,prepared=null,busy=false,done=false;
const hash=async value=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(value))))).map(x=>x.toString(16).padStart(2,'0')).join('');
const local=()=>{const raw=localStorage.getItem(KEY);if(!raw)throw Error('端末の本番データが見つかりません。中止します');const data=JSON.parse(raw);if(!data||!Array.isArray(data.days)||!Array.isArray(data.activities))throw Error('端末データ形式を確認できません');return {raw,data};};
const count=data=>({days:data.days.length,activities:data.activities.length,segments:data.days.reduce((s,d)=>s+(d.segments?.length||0),0),sleepSegments:data.days.reduce((s,d)=>s+(d.sleepSegments?.length||0),0),transactions:data.days.reduce((s,d)=>s+(d.transactions?.length||0),0)});
const ref=()=>doc(db,'darakuSyncV1',user.uid);
function setButtons(){ $('check').disabled=!user||busy||done;$('write').disabled=!prepared||!$('confirm').checked||busy||done; }
function errorMessage(e){return (e?.code?e.code+': ':'')+(e?.message||String(e));}
onAuthStateChanged(auth,u=>{user=u;prepared=null;$('status').textContent=u?'ログイン確認済み。①を押してください。':'未ログインです。本番アプリでログイン後に開き直してください。';setButtons();});
$('confirm').addEventListener('change',setButtons);
$('check').onclick=async()=>{busy=true;prepared=null;setButtons();$('status').textContent='読み取り中…';try{const before=local();const snap=await getDocFromServer(ref());if(!snap.exists())throw Error('クラウドの同期データがありません');const cloud=snap.data();if(cloud.ownerUid!==user.uid||cloud.format!=='daraku-sync-v1'||!Number.isInteger(cloud.revision)||cloud.backup?.format!=='daraku-countdown-backup'||cloud.backup?.version!==1)throw Error('クラウド形式が想定と異なります');if(cloud.revision!==1)throw Error('revisionが1ではありません。以前に更新済みの可能性があるため中止します');const cloudHash=await hash(cloud.backup.data);const localHash=await hash(before.data);const rawStill=localStorage.getItem(KEY);if(rawStill!==before.raw)throw Error('確認中に端末データが更新されました。①からやり直してください');prepared={raw:before.raw,rev:cloud.revision,cloudHash,localHash,uid:user.uid};$('status').textContent='読み取り成功\n端末: '+JSON.stringify(count(before.data))+'\nクラウド: '+JSON.stringify(count(cloud.backup.data))+'\nrevision: '+cloud.revision+'\n端末データSHA: '+localHash+'\nクラウドデータSHA: '+cloudHash+'\n一致: '+(localHash===cloudHash?'はい（更新不要）':'いいえ（更新対象）')+'\n端末書き込み: 0件';if(localHash===cloudHash){prepared=null;$('status').textContent+='\nデータが同じため更新しません。';}else if(cloudHash!==EXPECTED){prepared=null;$('status').textContent+='\n初回確認時のクラウドデータと異なるため、安全のため更新を中止しました。';}}catch(e){$('status').textContent='中止: '+errorMessage(e);}finally{busy=false;setButtons();}};
$('write').onclick=async()=>{if(!prepared||!user||!$('confirm').checked||busy||done)return;busy=true;setButtons();$('result').textContent='更新前の最終確認中…';try{const p=prepared;const current=local();if(current.raw!==p.raw)throw Error('①のあと端末データが変更されました。①からやり直してください');if(user.uid!==p.uid)throw Error('ログインユーザーが変更されました');const backup={format:'daraku-countdown-backup',version:1,exportedAt:new Date().toISOString(),data:current.data};const cloudBefore=await getDocFromServer(ref());if(!cloudBefore.exists()||cloudBefore.data().revision!==p.rev||await hash(cloudBefore.data().backup.data)!==p.cloudHash)throw Error('クラウドが変更されました。更新中止');if(localStorage.getItem(KEY)!==p.raw)throw Error('端末データが更新されました。更新中止');$('result').textContent='Firebaseトランザクション実行中…';await runTransaction(db,async tx=>{const snap=await tx.get(ref());if(!snap.exists())throw Error('クラウドが見つかりません');const c=snap.data();if(c.ownerUid!==p.uid||c.revision!==p.rev||await hash(c.backup.data)!==p.cloudHash)throw Error('クラウド競合を検知したため中止');if(localStorage.getItem(KEY)!==p.raw)throw Error('端末データが変更されたため中止');tx.update(ref(),{revision:p.rev+1,backup});});done=true;prepared=null;const after=await getDocFromServer(ref());const ok=after.exists()&&after.data().revision===p.rev+1&&await hash(after.data().backup.data)===p.localHash;$('result').textContent=ok?'成功：revision '+p.rev+' → '+(p.rev+1)+'\nクラウドのデータ内容が端末スナップショットと一致しました。\n端末書き込み: 0件\nクラウド書き込み: 1件\n自動同期: 無効':'更新処理は完了しましたが、再照合が一致しません。再実行せず結果を送ってください。';}catch(e){$('result').textContent='中止またはエラー: '+errorMessage(e)+'\n更新が完了したか不明な場合があります。再実行せず、①でrevisionを確認してください。';prepared=null;}finally{busy=false;setButtons();}};
</script></body></html>
