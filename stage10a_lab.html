<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第10段階A iPhone正本の初回クラウド登録</title><style>body{font-family:system-ui;background:#101827;color:#eef3fb;max-width:780px;margin:auto;padding:20px;line-height:1.7}section{background:#1e293b;padding:22px;border-radius:14px}button{display:block;width:100%;padding:13px;margin:12px 0;background:#334155;border:1px solid #64748b;color:white;border-radius:8px}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1220;padding:14px}.warn{color:#fbbf24}input{padding:10px;max-width:90%}</style></head><body><h2>第10段階A：iPhone正本をクラウドへ初回登録</h2><p class="warn">必ずiPhoneで、普段のアプリと同じURL・ログインで開いてください。PCでは実行しないでください。現在のiPhone localStorageを読み取ります。既存のFirestore文書と端末データは一切上書きしません。</p><section><p id="auth">ログイン確認中</p><button id="a1">① iPhone本番データの読み取り・検証</button><button id="a2">② 新規クラウド領域の未使用確認</button><button id="a3">③ iPhone最新データの保全JSONを保存</button><label><input id="saved" type="checkbox">③のJSONが実際に保存された</label><p class="warn">④はFirestoreに新規文書を1件作成します。アプリのタイマーは動いたままで構いません。④の瞬間の最新データを再読み取りします。</p><label>確認文字列：<input id="phrase" placeholder="iPhoneから初回登録" autocomplete="off"></label><button id="a4">④ iPhoneの現在データを新規クラウド文書へ登録</button><button id="a5">⑤ サーバーから再取得して完全一致を検証</button><pre id="status">①から開始してください。</pre></section><script type="module" src="./stage10a.js"></script></body></html>
