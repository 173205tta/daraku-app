<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stage 10D1 iPhone Preflight</title><style>body{font-family:system-ui;background:#101827;color:#f8fafc;max-width:720px;margin:20px auto;padding:18px;line-height:1.65}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:9px;font:inherit}input{background:#1e293b;color:white;border:1px solid #64748b}button{background:#2563eb;border:0;color:white}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e293b;padding:16px;border-radius:9px}aside{color:#fbbf24}</style></head><body><h2>第10段階D1：iPhone自動同期・事前検査</h2><aside>iPhoneのホーム画面に追加した本番アプリ内から開いてください。読み取り専用です。端末・クラウドに書き込みません。自動同期は開始しません。</aside><section id="loginArea"><input id="email" type="email" placeholder="Firebaseメールアドレス" autocomplete="username"><input id="password" type="password" placeholder="Firebaseパスワード" autocomplete="current-password"><button id="login">ログイン</button></section><button id="check" disabled>① iPhone最新データとクラウドを比較</button><button id="backup" disabled>② 最新iPhoneデータのJSONバックアップを保存</button><pre id="out">ログインしてください</pre><script type="module">
import {auth,db} from './firebase.js';
import {onAuthStateChanged,signInWithEmailAndPassword} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import {doc,getDocFromServer} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
const KEY='daraku_app_bank_v1', $=id=>document.getElementById(id);let uid=null,verified=false,busy=false;
function say(s){$('out').textContent=s}function check(x,msg){if(!x)throw Error(msg)}
function canonical(x){if(Array.isArray(x))return '['+x.map(canonical).join(',')+']';if(x&&typeof x==='object')return '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+canonical(x[k])).join(',')+'}';return JSON.stringify(x)}
async function hash(x){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonical(x)));return Array.from(new Uint8Array(bytes),v=>v.toString(16).padStart(2,'0')).join('')}
function local(){const raw=localStorage.getItem(KEY);check(raw,'この画面から本番データを読み取れません。Safariではなくホーム画面アプリから開いてください');const d=JSON.parse(raw);check(d&&d.settings&&Array.isArray(d.days)&&d.days.length&&Array.isArray(d.activities),'端末データの形式が不正');return d}
function counts(d){const sum=k=>d.days.reduce((n,x)=>n+(Array.isArray(x[k])?x[k].length:0),0);return {days:d.days.length,activities:d.activities.length,segments:sum('segments'),sleepSegments:sum('sleepSegments'),transactions:sum('transactions')}}
onAuthStateChanged(auth,u=>{uid=u?.uid||null;verified=false;$('loginArea').hidden=!!uid;$('check').disabled=!uid;$('backup').disabled=!uid;say(uid?'ログイン済み。①を押してください':'ログインしてください')});
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value=''}catch(e){$('password').value='';say('ログイン失敗：'+(e.code||e.message))}};
$('check').onclick=async()=>{if(busy||!uid)return;busy=true;$('check').disabled=true;try{check(navigator.onLine,'オフラインです');const who=uid;const before=local();const localHash=await hash(before);const snap=await getDocFromServer(doc(db,'darakuSyncV1',who));check(auth.currentUser?.uid===who,'ログイン状態が変わりました');check(snap.exists(),'クラウド文書がありません');const cloud=snap.data();check(cloud.ownerUid===who&&cloud.format==='daraku-sync-v1'&&cloud.backup?.format==='daraku-countdown-backup'&&cloud.backup.version===1,'クラウド文書の識別情報が不正');const cloudHash=await hash(cloud.backup.data);check(cloudHash===cloud.dataSha256,'クラウド内のデータとSHA-256が一致しません');check((await hash(local()))===localHash,'検査中に端末データが変化しました。①をやり直してください');verified=true;say('① 比較成功（読み取り専用）\n端末SHA-256: '+localHash+'\nクラウドSHA-256: '+cloudHash+'\n一致: '+(localHash===cloudHash?'はい':'いいえ（初回登録後に端末が更新された可能性）')+'\nrevision: '+cloud.revision+'\n端末: '+JSON.stringify(counts(before))+'\nクラウド: '+JSON.stringify(counts(cloud.backup.data))+'\n端末書き込み: 0件\nクラウド書き込み: 0件\n自動同期: 無効\n②で最新バックアップを保存して結果を送ってください');}catch(e){verified=false;say('検査停止：'+(e.code||e.message)+'\n書き込みは行っていません')}finally{busy=false;$('check').disabled=!uid}};
$('backup').onclick=()=>{try{const data=local();const blob=new Blob([JSON.stringify({format:'daraku-countdown-backup',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='daraku-stage10d1-iphone-'+Date.now()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);say('② 最新データのJSONダウンロードを開始しました。ファイルアプリで実際に保存されたことを確認してください。\n端末書き込み: 0件 / クラウド書き込み: 0件\n自動同期: 無効')}catch(e){say('バックアップ失敗：'+e.message)}};
</script></body></html>
