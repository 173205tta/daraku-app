<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第10段階F 読み取り専用診断 v1</title><style>body{background:#0e1729;color:#eaf1ff;font:16px system-ui;margin:0;padding:20px;line-height:1.6}main{max-width:720px;margin:auto}section{background:#1c2b43;border-radius:12px;padding:16px;margin:16px 0}button{background:#2d79d4;color:white;border:0;border-radius:9px;padding:13px;font-weight:bold;width:100%}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1423;padding:12px;border-radius:8px}small{color:#b8c6da}.warn{color:#ffcc82}</style></head><body><main><h2>第10段階F：読み取り専用診断 v1</h2><p class="warn">iPhoneホーム画面PWAからのみ実行。Firebaseへの書き込み・localStorageの変更・削除・復元は一切行いません。既存の第10段階F更新ボタンは押さないでください。</p><section><button id="check" disabled>3段階の読み取り診断を実行</button><pre id="status">認証待機中…</pre></section><p><small>個人の記録内容・メールアドレス・UIDは出力しません。SHA・件数・revision・判定のみ表示します。</small></p></main><script type="module">
import {auth,db} from './firebase.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import {doc,getDocFromServer,runTransaction} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
const KEY='daraku_app_bank_v1', el=document.getElementById('status'), btn=document.getElementById('check');let user=null,busy=false;
const digest=async s=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))).map(x=>x.toString(16).padStart(2,'0')).join('');
const sorted=v=>Array.isArray(v)?v.map(sorted):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,sorted(v[k])])):v;
const counts=d=>({days:d.days.length,activities:d.activities.length,segments:d.days.reduce((n,x)=>n+(x.segments?.length||0),0),sleepSegments:d.days.reduce((n,x)=>n+(x.sleepSegments?.length||0),0),transactions:d.days.reduce((n,x)=>n+(x.transactions?.length||0),0)});
const readLocal=()=>{const raw=localStorage.getItem(KEY);if(!raw)throw Error('iPhone本番データが見つかりません');const data=JSON.parse(raw);if(!Array.isArray(data?.days)||!Array.isArray(data?.activities))throw Error('端末データの形式が想定外');return {raw,data};};
const report=async c=>{if(!c||c.ownerUid!==user.uid||c.format!=='daraku-sync-v1'||!Number.isInteger(c.revision)||c.backup?.format!=='daraku-countdown-backup'||c.backup?.version!==1||!Array.isArray(c.backup?.data?.days)||!Array.isArray(c.backup?.data?.activities))throw Error('クラウド形式が想定外');return {revision:c.revision,counts:counts(c.backup.data),jsonSHA:await digest(JSON.stringify(c.backup.data)),sortedSHA:await digest(JSON.stringify(sorted(c.backup.data)))};};
const line=(name,x)=>name+'\n  revision: '+x.revision+'\n  件数: '+JSON.stringify(x.counts)+'\n  JSON順序SHA: '+x.jsonSHA+'\n  キー整列SHA: '+x.sortedSHA+'\n';
onAuthStateChanged(auth,u=>{user=u;btn.disabled=!u||busy;el.textContent=u?'ログイン確認済み。診断ボタンを押してください。':'未ログイン。本番PWAでログインしてから開き直してください。';});
btn.onclick=async()=>{if(!user||busy)return;busy=true;btn.disabled=true;el.textContent='読み取り専用診断中…';const uid=user.uid;try{const local=readLocal(),reference=doc(db,'darakuSyncV1',uid);const a=await getDocFromServer(reference);if(!a.exists())throw Error('クラウド同期文書が存在しません');const ra=await report(a.data());const b=await getDocFromServer(reference);if(!b.exists())throw Error('2回目でクラウド文書が存在しません');const rb=await report(b.data());const rt=await runTransaction(db,async tx=>{const snap=await tx.get(reference);if(!snap.exists())throw Error('トランザクション内で文書が存在しません');return await report(snap.data());},{maxAttempts:1});if(localStorage.getItem(KEY)!==local.raw)throw Error('診断中にiPhoneデータが変化。結果は無効');if(user?.uid!==uid)throw Error('診断中にログインユーザーが変化');const localSHA=await digest(JSON.stringify(local.data));const localSortedSHA=await digest(JSON.stringify(sorted(local.data)));const sameRev=ra.revision===rb.revision&&rb.revision===rt.revision;const sameSorted=ra.sortedSHA===rb.sortedSHA&&rb.sortedSHA===rt.sortedSHA;const sameJSON=ra.jsonSHA===rb.jsonSHA&&rb.jsonSHA===rt.jsonSHA;el.textContent='読み取り診断完了（書き込みなし）\n端末件数: '+JSON.stringify(counts(local.data))+'\n端末JSON順序SHA: '+localSHA+'\n端末キー整列SHA: '+localSortedSHA+'\n\n'+line('① サーバー読み取り1',ra)+'\n'+line('② サーバー読み取り2',rb)+'\n'+line('③ トランザクション内読み取り（書き込みなし）',rt)+'\nrevision一致: '+(sameRev?'はい':'いいえ')+'\nJSON順序SHA一致: '+(sameJSON?'はい':'いいえ')+'\nキー整列SHA一致: '+(sameSorted?'はい':'いいえ')+'\n判定: '+(!sameRev?'revisionが変化：調査が必要':sameSorted&&!sameJSON?'データ内容は同等の可能性が高く、JSONのキー順序差が原因候補':sameSorted&&sameJSON?'3回の読み取りで一致':'データ内容に差がある可能性：更新禁止')+'\n端末書き込み: 0件\nFirebase書き込み: 0件';}catch(e){el.textContent='診断中止: '+(e?.code?e.code+': ':'')+(e?.message||String(e))+'\nFirebase・端末への書き込みは行っていません。';}finally{busy=false;btn.disabled=!user;}};
</script></body></html>
