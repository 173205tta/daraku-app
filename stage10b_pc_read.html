<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第10段階B PC読み取り検証</title><style>body{font-family:system-ui;background:#101827;color:#f8fafc;max-width:640px;margin:24px auto;padding:16px}input,button{display:block;box-sizing:border-box;width:100%;padding:13px;margin:10px 0;border-radius:9px}button{background:#2563eb;color:white;border:0}input{background:#1e293b;color:white;border:1px solid #64748b}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e293b;padding:16px;border-radius:9px}small{color:#fbbf24}</style></head><body><h2>第10段階B：PC読み取り専用テスト</h2><p>Firestoreの初回iPhoneデータをPCから読み取り、件数を確認します。</p><small>このページはFirestore・localStorageへの書き込み、ダウンロード、復元を行いません。iPhone本番データには触れません。</small><input id="email" type="email" placeholder="Firebaseメールアドレス" autocomplete="username"><input id="password" type="password" placeholder="パスワード" autocomplete="current-password"><button id="login">Firebaseにログイン</button><button id="check" disabled>クラウドの初回データを読み取る</button><pre id="result">未ログイン</pre><script type="module">
import {auth,db} from './firebase.js';
import {signInWithEmailAndPassword} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import {doc,getDoc} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
const $=id=>document.getElementById(id);let user=null;
$('login').onclick=async()=>{try{$('result').textContent='ログイン中…';const c=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);user=c.user;$('password').value='';$('check').disabled=false;$('result').textContent='ログイン成功。読み取りボタンを押してください。\nUID末尾：'+user.uid.slice(-6);}catch(e){$('result').textContent='ログイン失敗：'+e.code;}};
$('check').onclick=async()=>{try{if(!user)throw Error('未ログイン');$('result').textContent='Firestore読み取り中…';const snap=await getDoc(doc(db,'darakuSyncV1',user.uid));if(!snap.exists()){ $('result').textContent='該当UIDの初回同期文書がありません。何も変更していません。';return;}const d=snap.data();const b=d.backup;if(d.ownerUid!==user.uid||d.format!=='daraku-sync-v1'||b?.format!=='daraku-countdown-backup'||b?.version!==1||!b.data||!Array.isArray(b.data.days)||!Array.isArray(b.data.activities)){throw Error('文書形式の検証に失敗');}const days=b.data.days;const count=k=>days.reduce((s,x)=>s+(Array.isArray(x[k])?x[k].length:0),0);const summary={days:days.length,activities:b.data.activities.length,segments:count('segments'),sleepSegments:count('sleepSegments'),transactions:count('transactions')};$('result').textContent='PC読み取り成功（読み取り専用）\n'+JSON.stringify(summary,null,2)+'\nrevision: '+d.revision+'\n端末データ変更：0件\nクラウド書き込み：0件\n\n※この画面はSHA-256の一致検証をしていません。';}catch(e){$('result').textContent='読み取り失敗：'+(e.code||e.message);}};
</script></body></html>
