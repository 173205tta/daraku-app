<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第10段階C：PCクラウド監視</title><style>body{font-family:system-ui;background:#101827;color:#f8fafc;max-width:700px;margin:24px auto;padding:16px;line-height:1.6}input,button{display:block;box-sizing:border-box;width:100%;padding:13px;margin:10px 0;border-radius:9px}button{background:#2563eb;color:white;border:0}button:disabled{opacity:.5}input{background:#1e293b;color:white;border:1px solid #64748b}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e293b;padding:16px;border-radius:9px}small{color:#fbbf24}</style></head><body><h2>第10段階C：PCクラウド更新監視</h2><p>初回iPhoneバックアップをSHA-256で照合し、その後のクラウド変更を監視します。</p><small>読み取り専用。Firestore・localStorage・IndexedDBへの書き込み、データ復元は行いません。自動同期はまだ有効化されません。</small><input id="email" type="email" placeholder="Firebaseメールアドレス" autocomplete="username"><input id="password" type="password" placeholder="パスワード" autocomplete="current-password"><button id="login">ログイン</button><button id="start" disabled>サーバー照合・更新監視を開始</button><button id="stop" disabled>監視を停止</button><pre id="result">未ログイン</pre><script type="module">
import {auth,db} from './firebase.js';
import {signInWithEmailAndPassword,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import {doc,getDocFromServer,onSnapshot} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
const $=id=>document.getElementById(id);let uid=null,unsubscribe=null,seen=null;
const expected='dcbfe6c7dbad4650204cd380c4c624163ffde395b6bd3fc49caf52dd49fae9e2';
function canonical(x){if(Array.isArray(x))return '['+x.map(canonical).join(',')+']';if(x&&typeof x==='object')return '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+canonical(x[k])).join(',')+'}';return JSON.stringify(x)}
async function hash(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonical(x)));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function counts(d){const days=d.days;const count=k=>days.reduce((s,x)=>s+(Array.isArray(x[k])?x[k].length:0),0);return {days:days.length,activities:d.activities.length,segments:count('segments'),sleepSegments:count('sleepSegments'),transactions:count('transactions')}}
function validate(d){if(d.ownerUid!==uid||d.format!=='daraku-sync-v1'||!Number.isSafeInteger(d.revision)||d.revision<1||d.backup?.format!=='daraku-countdown-backup'||d.backup.version!==1||!Array.isArray(d.backup.data?.days)||!Array.isArray(d.backup.data?.activities)||typeof d.dataSha256!=='string')throw Error('文書構造または所有者が不正です')}
async function report(s,kind){if(!s.exists())throw Error('同期文書が見つかりません');const d=s.data();validate(d);const h=await hash(d.backup.data);if(h!==d.dataSha256)throw Error('保存済みハッシュと実データが不一致');if(d.revision===1&&h!==expected)throw Error('初回登録時の既知SHA-256と不一致');const c=counts(d.backup.data);if(d.revision===1&&JSON.stringify(c)!==JSON.stringify({days:4,activities:4,segments:58,sleepSegments:16,transactions:3}))throw Error('初回登録時の件数が不一致');const old=seen;seen=d.revision;const note=kind==='監視'&&old!==null&&old!==d.revision?'クラウドrevisionの変更を検知':'照合完了';$('result').textContent=`${note}（${kind}）\nrevision: ${d.revision}\nSHA-256: ${h}\n${d.revision===1?'初回iPhone SHA-256：完全一致':'更新後データ：文書内ハッシュ一致（初回値との一致は要求しません）'}\n${JSON.stringify(c,null,2)}\n端末データ変更：0件\nクラウド書き込み：0件\n監視：${unsubscribe?'稼働中':'開始準備中'}`}
function stop(){if(unsubscribe){unsubscribe();unsubscribe=null;}$('stop').disabled=true;$('start').disabled=!uid}
onAuthStateChanged(auth,u=>{if(uid!==u?.uid){stop();seen=null;uid=u?.uid||null;$('start').disabled=!uid;$('result').textContent=uid?'ログイン済み。照合・監視を開始できます':'未ログイン'}});
$('login').onclick=async()=>{try{$('result').textContent='ログイン中…';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value='';$('result').textContent='ログイン成功。照合・監視を開始してください'}catch(e){$('password').value='';$('result').textContent='ログイン失敗：'+(e.code||e.message)}};
$('start').onclick=async()=>{if(!uid||unsubscribe)return;const who=uid;$('start').disabled=true;$('result').textContent='サーバーから初回照合中…';try{const r=doc(db,'darakuSyncV1',who);const s=await getDocFromServer(r);if(auth.currentUser?.uid!==who)throw Error('認証が変更されました');await report(s,'サーバー');unsubscribe=onSnapshot(r,{includeMetadataChanges:false},snap=>{if(snap.metadata.fromCache)return;report(snap,'監視').catch(e=>{stop();$('result').textContent='検証停止：'+e.message})},e=>{stop();$('result').textContent='監視エラー：'+(e.code||e.message)});$('stop').disabled=false;if(unsubscribe)$('result').textContent=$('result').textContent.replace('監視：開始準備中','監視：稼働中');}catch(e){$('result').textContent='検証失敗：'+(e.code||e.message);$('start').disabled=false}};
$('stop').onclick=()=>{stop();$('result').textContent+='\n監視を停止しました'};
</script></body></html>
