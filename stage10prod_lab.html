<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>本番Firebase初回登録・安全検証</title><style>body{font:16px system-ui;background:#101827;color:#f1f5f9;max-width:700px;margin:auto;padding:20px}button,input{font:inherit;padding:12px;margin:5px 0;box-sizing:border-box}input{width:100%}button{width:100%;border:0;border-radius:8px;background:#2563eb;color:white}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e293b;padding:12px;border-radius:8px}.warning{background:#78350f;padding:14px;border-radius:8px}label{display:block;padding:12px}</style></head><body><h1>本番Firebase 初回登録</h1><p class="warning">必ず普段使っているiPhoneホーム画面PWAから開く。PC・Safariから登録しない。iPhoneの記録を削除・初期化しない。先に本番Firebaseのルールを設定する。</p><p>接続先：<strong id="project">確認中</strong></p><p id="authState">未ログイン</p><input id="email" type="email" placeholder="本番Firebaseのメールアドレス" autocomplete="username"><input id="password" type="password" placeholder="パスワード" autocomplete="current-password"><button id="login">本番Firebaseにログイン</button><button id="register">本番Firebaseに新規アカウント登録</button><button id="read" disabled>① iPhone本番データを読み取り・検証</button><button id="check" disabled>② 本番クラウド同期先が空か確認</button><button id="backup" disabled>③ 最新バックアップJSONを保存</button><label><input id="saved" type="checkbox" style="width:auto"> ③のJSONが「ファイル」アプリに実際に保存された</label><button id="create" disabled>④ 本番Firebaseへ初回登録（1回のみ）</button><button id="verify" disabled>⑤ サーバーから再取得して照合</button><pre id="log">待機中</pre><script type="module" src="./stage10prod_lab.js"></script></body></html>
